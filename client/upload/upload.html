<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GalleryArt - העלאת יצירה</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="upload.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="upload.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-800 font-assistant">

  <!-- Header -->
<!-- Header -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
    <a href="../home/home.html" class="text-2xl font-extrabold text-gray-800 tracking-tight">🎨 GalleryArt</a>
    <nav class="flex space-x-6 space-x-reverse text-lg items-center">
      <a href="../home/home.html" class="hover:text-pink-500 transition duration-200">דף הבית</a>
      <a href="../gallery/gallery.html" class="hover:text-pink-500 transition duration-200">גלריה</a>

      <!-- החשבון שלי -->
      <a href="../account/account.html" class="flex items-center gap-2 hover:text-pink-500 transition duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5.121 17.804A9.969 9.969 0 0112 15c2.486 0 4.735.896 6.879 2.804M15 10a3 3 0 11-6 0 3 3 0 016 0zM12 2a10 10 0 100 20 10 10 0 000-20z"/>
        </svg>
        <span>החשבון שלי</span>
      </a>
    </nav>
  </div>
</header>


  <!-- תוכן העמוד -->
  <div class="auth-container">
    <i class="bi bi-image icon-logo"></i>
    <h2>העלאת יצירה</h2>

    <form id="uploadForm" enctype="multipart/form-data" class="auth-form">
      <input type="file" id="imagePath" name="image" accept="image/*" required />
      <textarea id="titleInput" name="title" placeholder="תיאור היצירה שלך" rows="4"></textarea>
      <button type="submit">העלה</button>
    </form>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>פרופיל יוצר - GalleryArt</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="artist.css" />
</head>
<body class="bg-gray-50 font-assistant text-gray-800">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="../home/home.html" class="text-2xl font-bold text-pink-500">🎨 GalleryArt</a>
      <nav class="flex space-x-6 space-x-reverse text-lg">
        <a href="../home/home.html" class="hover:text-pink-500">דף הבית</a>
        <a href="../gallery/gallery.html" class="hover:text-pink-500">גלריה</a>
         <!-- החשבון שלי -->
      <a href="../account/account.html" class="flex items-center gap-2 hover:text-pink-500 transition duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5.121 17.804A9.969 9.969 0 0112 15c2.486 0 4.735.896 6.879 2.804M15 10a3 3 0 11-6 0 3 3 0 016 0zM12 2a10 10 0 100 20 10 10 0 000-20z"/>
        </svg>
        <span>החשבון שלי</span>
      </a>
      </nav>
    </div>
  </header>

  <!-- Artist Info -->
  <section id="artistInfo" class="bg-white py-12 shadow">
    <!-- נטען דינמית -->
  </section>

  <!-- Artworks -->
  <section class="py-12 px-6 max-w-6xl mx-auto">
    <h3 class="text-2xl font-bold text-pink-500 mb-6 text-center">היצירות</h3>
    <div id="artistArtworks" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- יצירות נטענות דינאמית -->
    </div>
  </section>
<!-- Modal -->
<div id="imageModal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-50">
  <div class="bg-white rounded-2xl max-w-3xl w-11/12 p-4 relative">
    <button id="closeModal" class="absolute top-2 left-2 text-gray-600 hover:text-red-500 text-2xl">&times;</button>
    <img id="modalImage" src="" alt="Artwork" class="w-full h-auto max-h-[80vh] object-contain rounded-xl shadow">
  </div>
</div>

  <footer class="bg-gray-100 py-6 text-center text-gray-500 text-sm">
    <p>© 2025 GalleryArt - כל הזכויות שמורות</p>
  </footer>

  <script src="artist.js"></script>
</body>
</html>

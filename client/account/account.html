<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>החשבון שלי - GalleryArt</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="account.css">
</head>
<body class="bg-gray-50 font-assistant text-gray-800">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="../home/home.html" class="text-2xl font-bold text-pink-500">🎨 GalleryArt</a>
      <nav class="flex space-x-6 space-x-reverse text-lg items-center">
        <a href="../home/home.html" class="hover:text-pink-500">דף הבית</a>
        <a href="../gallery/gallery.html" class="hover:text-pink-500">גלריה</a>
        <a href="../account/account.html" class="text-pink-500 font-semibold flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-pink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M5.121 17.804A9.969 9.969 0 0112 15c2.486 0 4.735.896 6.879 2.804M15 10a3 3 0 11-6 0 3 3 0 016 0zM12 2a10 10 0 100 20 10 10 0 000-20z"/>
          </svg>
          <span>החשבון שלי</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Profile Section -->
  <section id="profileSection" class="bg-white shadow rounded-lg max-w-4xl mx-auto mt-8 p-6 text-center">
    <img id="profilePic" src="/uploads/default.png" class="mx-auto w-32 h-32 rounded-full border-4 border-pink-400 object-cover" />
    <h2 id="fullName" class="text-2xl font-bold text-pink-600 mt-4"></h2>
    <p id="description" class="text-gray-600 mt-2"></p>

    <div class="flex justify-center gap-8 mt-6 text-gray-700">
      <div class="text-center">
        <span id="totalArts" class="block text-xl font-bold">0</span>
        <span>יצירות</span>
      </div>
      <div class="text-center">
        <span id="totalLikes" class="block text-xl font-bold">0</span>
        <span>לייקים</span>
      </div>
    </div>

    <div class="mt-6">
      <button id="editProfileBtn" class="bg-pink-500 hover:bg-pink-600 text-white px-6 py-2 rounded-full">עריכת פרופיל</button>
      <button id="logoutBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded-full ml-2">התנתקות</button>
      <button id="deleteAccountBtn" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-full ml-2"> מחיקת חשבון</button>
    </div>
  </section>

  <!-- My Artworks -->
  <section class="max-w-6xl mx-auto mt-12 px-4">
    <h3 class="text-2xl font-bold text-pink-500 mb-6 text-center">היצירות שלי</h3>
    <div id="myArtworks" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- יצירות נטענות דינמית -->
    </div>
  </section>

  <footer class="bg-gray-100 py-6 text-center text-gray-500 text-sm mt-16">
    <p>© 2025 GalleryArt - כל הזכויות שמורות</p>
  </footer>
<div id="editProfileModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
  <div class="bg-white rounded-lg p-6 w-96 shadow-lg">
    <h2 class="text-xl font-bold mb-4">עריכת פרופיל</h2>
    
    <label class="block mb-2 text-sm">שם מלא:</label>
    <input id="editFullName" type="text" class="border p-2 w-full mb-4 rounded" />

    <label class="block mb-2 text-sm">תיאור:</label>
    <textarea id="editDescription" class="border p-2 w-full mb-4 rounded"></textarea>

  <label class="block mb-2 text-sm">תמונת פרופיל:</label>

<!-- תצוגה מקדימה -->
<img id="previewProfilePic" src="/uploads/default.png" 
     class="w-24 h-24 rounded-full mb-2 object-cover mx-auto cursor-pointer" />
<!-- זה הכפתור שלנו (label מחובר ל-input) -->
<label for="editProfilePic" 
       class="cursor-pointer bg-pink-500 hover:bg-pink-600 text-white px-3 py-1 rounded-full text-xs block w-fit mx-auto">
  בחר תמונה חדשה
</label>

<!-- input קיים אבל מוסתר -->
<input id="editProfilePic" type="file" accept="image/*" class="hidden" />




    <div class="flex justify-end gap-2">
      <button id="cancelEditBtn" class="px-4 py-2 bg-gray-200 rounded">ביטול</button>
      <button id="saveEditBtn" class="px-4 py-2 bg-pink-500 text-white rounded">שמור</button>
    </div>
  </div>
</div>
<div id="editArtModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
  <div class="bg-white rounded-lg p-6 w-96 shadow-lg">
    <h2 class="text-xl font-bold mb-4">עריכת יצירה</h2>

    <label class="block mb-2 text-sm">שם היצירה:</label>
    <input id="editArtTitle" type="text" class="border p-2 w-full mb-4 rounded" />

    <div class="flex justify-end gap-2">
      <button id="cancelEditArtBtn" class="px-4 py-2 bg-gray-200 rounded">ביטול</button>
      <button id="saveEditArtBtn" class="px-4 py-2 bg-pink-500 text-white rounded">שמור</button>
    </div>
  </div>
</div>
<!-- Image Modal -->
<div id="imageModal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center z-[60]">
  <div class="bg-white rounded-2xl max-w-3xl w-11/12 p-4 relative shadow-2xl">
    <button id="closeImageModal" class="absolute top-2 left-2 text-gray-600 hover:text-red-500 text-2xl" aria-label="סגור">
      &times;
    </button>
    <img id="modalImage" src="" alt="" class="w-full h-auto max-h-[80vh] object-contain rounded-xl">
    <p id="modalCaption" class="mt-3 text-center text-gray-600"></p>
  </div>
</div>


  <script src="account.js"></script>
</body>
</html>

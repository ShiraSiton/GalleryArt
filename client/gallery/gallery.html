<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>גלריית יצירות - GalleryArt</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body class="bg-gray-100 font-assistant">

<!-- Header -->
<header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
    <a href="../home/home.html" class="text-2xl font-extrabold text-gray-800 tracking-tight">🎨 GalleryArt</a>
    <nav class="flex space-x-6 space-x-reverse text-lg items-center">
      <a href="../home/home.html" class="hover:text-pink-500 transition duration-200">דף הבית</a>
      <a href="gallery.html" class="text-pink-500 font-semibold">גלריה</a>

      <!-- החשבון שלי -->
      <a href="../account/account.html" class="flex items-center gap-2 hover:text-pink-500 transition duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5.121 17.804A9.969 9.969 0 0112 15c2.486 0 4.735.896 6.879 2.804M15 10a3 3 0 11-6 0 3 3 0 016 0zM12 2a10 10 0 100 20 10 10 0 000-20z"/>
        </svg>
        <span>החשבון שלי</span>
      </a>
    </nav>
  </div>
</header>


  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-10">
    <h1 class="text-4xl font-bold mb-10 text-center text-gray-800">גלריית יצירות</h1>

    <!-- Search -->
    <div class="flex justify-center mb-10">
      <input id="searchInput" type="text" placeholder="🔍 חיפוש יצירה..." 
             class="w-full md:w-1/2 border border-gray-300 rounded-full px-5 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-pink-400 transition" />
    </div>

    <!-- Gallery Grid -->
    <section id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
      <!-- יצירות יצופו כאן דינאמית -->
    </section>
  </main>

  <script src="gallery.js"></script>
</body>
</html>
